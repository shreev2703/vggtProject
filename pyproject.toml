[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vggt_bench"
version = "0.1.0"
description = "Sparse-view 3D reconstruction benchmark: VGGT vs. COLMAP"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
include = ["vggt_bench*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
